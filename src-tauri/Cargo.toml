[package]
name = "tauri-app"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
raw-window-handle = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
cpal = "0.15"
hound = "3"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Core Audio Process Tap (system-audio loopback without a screen-recording
# prompt or a third-party virtual device). Requires macOS 14.2+ at runtime.
#
# TEMPORARY: points at a local vendored+patched copy (vendor/cidre) while the
# public fork (github.com/ilse31/cidre) hasn't been created yet — repo
# creation needs the user's explicit go-ahead. Once that fork exists, switch
# this to `{ git = "https://github.com/ilse31/cidre", rev = "<sha>", ... }`
# and delete vendor/cidre (see its tap_description.rs for why it's patched:
# upstream 0.29.0's TapDesc::with_* helpers don't compile under a narrow
# feature set because TapDesc is a weakly-linked, version-gated class).
cidre = { path = "vendor/cidre", default-features = false, features = ["core_audio", "dispatch"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Media_SpeechRecognition",
  "Foundation",
  "Foundation_Collections",
] }

[dev-dependencies]
tempfile = "3"

